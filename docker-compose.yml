services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    ports:
      # Bound to loopback only: the factory reaches this over the internal compose
      # network (postgres:5432), never via the host's public interface. Without
      # this, a plain "5432:5432" binds 0.0.0.0 and exposes Postgres to the
      # internet on any host with a public IP. Still reachable for local
      # debugging via an SSH tunnel: ssh -L 5432:localhost:5432 <host>.
      - "127.0.0.1:5432:5432"
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 20

  factory:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
    ports:
      # Loopback only: Caddy (below) is the sole public entrypoint now, terminating
      # TLS and reverse-proxying over the internal compose network. Still reachable
      # for local debugging via curl on the host itself or an SSH tunnel.
      - "127.0.0.1:8000:8000"
    # The image runs as a fixed non-root user (uid 10001), but /var/run/docker.sock
    # on the host is owned by root:docker (mode 660) — without group membership
    # matching the host's docker group GID, this non-root user gets a permission
    # error talking to the socket and `docker_available()` reports false, silently
    # and permanently disabling Development. The docker group's GID is not the same
    # across hosts/distros, so it cannot be baked into the image at build time —
    # set DOCKER_GID in .env to the output of: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      # Sibling-container sandboxing: the factory asks the *host* daemon to run
      # ephemeral, unprivileged containers (docker.sock is mounted, not a
      # docker-in-docker daemon of its own). That has a sharp edge: `docker run -v
      # SRC:DST` issued from inside this container is resolved by the daemon against
      # the HOST's filesystem, not this container's — a named volume, or any path
      # that doesn't look identical on both sides, silently mounts the wrong (often
      # empty) directory into every sandbox. The fix is this bind mount using the
      # *same literal path* on the host and in the container, matched by
      # WORKSPACE_ROOT in .env — see the "Sandboxing note" in DEPLOYMENT.md, and
      # `factory.preflight.check_sandbox_workspace_sharing`, which verifies this
      # actually works at every boot rather than assuming it from config.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_HOST_PATH:-/srv/factory-workspaces}:/srv/factory-workspaces
      # blacklist.txt was previously baked into the image (COPY'd at build time,
      # see the Dockerfile) with no volume — every redeploy silently reset it to
      # the git-tracked version, discarding every GDPR-erasure/unsubscribe
      # tombstone written at runtime and re-permitting outreach to addresses that
      # had opted out. Bind-mounted so runtime writes from erase_lead() survive a
      # redeploy. Must be seeded once from the repo's blacklist.txt before first
      # boot on a new host — see DEPLOYMENT.md.
      - ${BLACKLIST_HOST_PATH:-/srv/factory-blacklist/blacklist.txt}:/app/blacklist.txt
    command: ["python", "-m", "factory.main"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - factory
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      # 80 is required even for an HTTPS-only site: Caddy uses it for the ACME
      # HTTP-01 challenge (and to redirect plain-HTTP requests) when it
      # provisions/renews the Let's Encrypt certificate for PUBLIC_DOMAIN.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  factory-pgdata:
  caddy-data:
  caddy-config:
